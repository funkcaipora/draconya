# .github/workflows/ci.yml — CI do harness do Draconya (docs/harness-plan.md §4.4).
#
# Dois jobs independentes, que rodam em paralelo:
#
#   - docs: valida a documentação estrutural (scripts/docs-check.mjs). Não depende de o
#     monorepo existir, então roda cheio desde o primeiro commit.
#   - code: pnpm install / lint / test / build. Antes da Fase 1 criar o package.json raiz
#     (docs/technical-architecture.md §17, épico E0) não há nada para instalar, lintar, testar
#     ou buildar — o job detecta isso e PULA os passos em vez de falhar, para o CI não ficar
#     vermelho por um monorepo que ainda não nasceu. Ver o passo "Verifica se o monorepo já
#     existe" abaixo: assim que o package.json raiz existir, os passos passam a rodar de
#     verdade sozinhos, sem precisar editar este arquivo.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Padrão de menor privilégio: nenhum job aqui escreve de volta no repositório ou em release.
permissions:
  contents: read

jobs:
  docs:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate documentation
        run: node scripts/docs-check.mjs

  code:
    name: lint, test and build
    runs-on: ubuntu-latest
    services:
      # Sem Redis os testes de diretório e de lease apenas PULAM — e teste que pula em
      # silêncio é pior que teste que não existe, porque dá falsa confiança.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sem esta checagem, o passo "pnpm install" seria o primeiro a falhar (não há
      # package.json nem lockfile para instalar) e todo o job ficaria vermelho por um motivo
      # que não é um bug de código — é só a Fase 1 ainda não ter rodado.
      - name: Check workspace availability
        id: monorepo
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Root package.json is missing — skipping install/lint/test/build."
          fi

      - name: Install pnpm
        if: steps.monorepo.outputs.exists == 'true'
        # Sem `version`: o package.json raiz declara "packageManager" desde o scaffold do
        # monorepo, e é dele que a action tira a versão. Declarar nos dois lugares é como as
        # duas fontes divergem sem ninguém perceber.
        uses: pnpm/action-setup@v4

      - name: Node 24
        if: steps.monorepo.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.monorepo.outputs.exists == 'true'
        run: pnpm install

      - name: Lint package boundaries
        if: steps.monorepo.outputs.exists == 'true'
        run: pnpm lint

      - name: Tests
        if: steps.monorepo.outputs.exists == 'true'
        run: pnpm test

      - name: Build
        if: steps.monorepo.outputs.exists == 'true'
        run: pnpm build

  image:
    name: multi-architecture build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Dockerfile availability
        id: docker
        run: test -f Dockerfile && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: QEMU
        if: steps.docker.outputs.exists == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        if: steps.docker.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      # Constrói as duas arquiteturas do ADR 0013. Não publica: o objetivo aqui é falhar
      # o PR quando alguma dependência nativa nova não tiver binário para as duas.
      - name: Build amd64 e arm64
        if: steps.docker.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
