# .github/workflows/ci.yml — CI do harness do Draconya (docs/harness-plan.md §4.4).
#
# Três checks independentes, em paralelo, seguidos pelo deploy de staging na main:
#
#   - docs: valida a documentação estrutural e a política de linguagem do repositório.
#     Chama os scripts pelo NOME no package.json, nunca o arquivo direto: assim, como um
#     script executa é decisão de um lugar só — foi o `node scripts/docs-check.mjs` cravado
#     aqui que fez a migração para TypeScript (ADR 0016) ter dois lugares para acertar em
#     vez de um.
#     Este job passou a instalar o workspace, porque os scripts rodam por `tsx`. Ele não é
#     mais o job que rodaria num repositório sem monorepo — o que deixou de importar quando
#     a Fase 1 criou o package.json raiz.
#   - code: pnpm install / lint / test / build. O passo "Check workspace availability" abaixo
#     é herança da época em que o monorepo ainda não existia e o job precisava pular em vez
#     de falhar; hoje a condição é sempre verdadeira.
#   - image: constrói a imagem em `linux/amd64` E A SOBE, porque construir não é subir. O
#     build `arm64` está SUSPENSO — ver o comentário no job e a emenda no ADR 0013.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Padrão de menor privilégio: nenhum job aqui escreve de volta no repositório ou em release.
permissions:
  contents: read

jobs:
  deploy-staging:
    name: deploy staging
    needs: [docs, code, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: ${{ vars.APP_ORIGIN }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sync configuration, deploy and verify staging
        run: node scripts/deploy-staging.ts
        env:
          GH_TOKEN: ${{ github.token }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          GAME_PUBLIC_URL: ${{ vars.GAME_PUBLIC_URL }}

  docs:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Validate documentation
        run: pnpm docs-check

      - name: Validate source language policy
        run: pnpm source-policy

  code:
    name: lint, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: draconya
          POSTGRES_PASSWORD: review-local
          POSTGRES_DB: draconya_review
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U draconya" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379
      DATABASE_TEST_URL: postgres://draconya:review-local@localhost:5432/draconya_review
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Sem Redis os testes de diretório e de lease apenas PULAM — e teste que pula em
      # silêncio é pior que teste que não existe, porque dá falsa confiança.
      #
      # `docker run` e não um service container: service não aceita argumentos, e o Redis
      # padrão tem 16 bancos (0–15) — `SELECT 16` de `party-v2-exit.postgres.test.ts` cai no
      # banco 0 em silêncio. `--databases 32` é requisito da suíte desde a #407. A espera de
      # prontidão substitui o health gate que o service dava.
      - name: Start Redis (32 databases)
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --databases 32
          for i in $(seq 1 30); do
            if docker exec redis redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          echo "redis did not become ready" >&2
          exit 1

      # Sem esta checagem, o passo "pnpm install" seria o primeiro a falhar (não há
      # package.json nem lockfile para instalar) e todo o job ficaria vermelho por um motivo
      # que não é um bug de código — é só a Fase 1 ainda não ter rodado.
      - name: Check workspace availability
        id: monorepo
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Root package.json is missing — skipping install/lint/test/build."
          fi

      - name: Install pnpm
        if: steps.monorepo.outputs.exists == 'true'
        # Sem `version`: o package.json raiz declara "packageManager" desde o scaffold do
        # monorepo, e é dele que a action tira a versão. Declarar nos dois lugares é como as
        # duas fontes divergem sem ninguém perceber.
        uses: pnpm/action-setup@v6

      - name: Node 24
        if: steps.monorepo.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.monorepo.outputs.exists == 'true'
        run: pnpm install

      - name: Lint package boundaries
        if: steps.monorepo.outputs.exists == 'true'
        run: pnpm lint

      - name: Tests
        if: steps.monorepo.outputs.exists == 'true'
        run: pnpm test

      - name: Build
        if: steps.monorepo.outputs.exists == 'true'
        run: pnpm build

  image:
    name: image build and boot (amd64)
    runs-on: ubuntu-latest
    services:
      # O nó carrega `content` e conecta no diretório de sessões antes de servir. Sem Redis
      # o passo de boot abaixo não teria o que provar.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      # E Postgres porque o papel `api` passou a exigir banco no boot (FUN-10/FUN-11): o
      # `main.ts` faz `database.ping()` antes de servir. Só o `select 1` — nenhuma migração
      # precisa ter rodado —, mas sem o serviço o container sobe em modo solo e trava antes
      # de emitir a primeira linha de log.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: draconya
          POSTGRES_PASSWORD: boot-check
          POSTGRES_DB: draconya_boot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U draconya" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Dockerfile availability
        id: docker
        run: test -f Dockerfile && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Buildx
        if: steps.docker.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      # Uma arquitetura só, e sem QEMU. O runner do GitHub é amd64: construir amd64 é nativo
      # e rápido; construir arm64 aqui significa EMULAR, e a emulação era a quase totalidade
      # dos ~5 minutos que este job levava.
      #
      # O que se PERDE: a checagem do ADR 0013 de que toda dependência nativa nova publica
      # binário para as duas arquiteturas. A perda é menor do que parece — o desenvolvimento
      # roda em Apple Silicon, então o build local já exercita `arm64` nativamente. O CI passa
      # a cobrir justamente a arquitetura que a máquina de quem desenvolve não cobre.
      #
      # O que ainda se GANHA: saber que a imagem constrói. Não é formalidade — foi este job
      # que pegou o vazamento de `.tsbuildinfo` (imagem publicada sem `dist`) e o GLIBC velho
      # do bookworm, dois defeitos invisíveis no macOS.
      #
      # QUANDO RELIGAR: antes do primeiro deploy em ARM (o Oracle Ampere é a rota de
      # validação sem custo), ou ao adicionar dependência nativa nova. Religar são duas
      # linhas: o passo de setup do QEMU de volta, e a segunda plataforma em `platforms`.
      - name: Build amd64
        if: steps.docker.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: draconya:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Construir não é subir. A imagem já saiu daqui compilando e SEM conseguir bootar: os
      # dados de `content` não entravam, e o nó os carrega no boot para fixar a versão em cada
      # sessão. O CI aprovou; quem descobriu foi um `docker run` à mão.
      #
      # Este passo custa segundos e cobre a classe inteira: falta arquivo no estágio final,
      # variável obrigatória sem default, permissão do usuário `node`, binário nativo com ABI
      # errada. Nenhuma delas aparece no build.
      - name: Boot the image and hit /healthz
        if: steps.docker.outputs.exists == 'true'
        run: |
          # `--network host`, e não `-p`: o serviço de Redis do job publica a porta no HOST do
          # runner, não numa rede que um container avulso alcance. Com `-p` e o IP do bridge o
          # boot trava no `redis.ping()` ANTES de qualquer log — a primeira tentativa deste
          # passo falhou exatamente assim, com `docker logs` vazio e nada explicando.
          docker run -d --name draconya-ci --network host \
            -e DATABASE_URL=postgres://draconya:boot-check@localhost:5432/draconya_boot \
            -e REDIS_URL=redis://localhost:6379 \
            -e NODE_ENV=development \
            draconya:ci
          if ! curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://localhost:3000/healthz; then
            echo '::error::a imagem não respondeu em /healthz'
            docker logs draconya-ci 2>&1 | tail -40
            # Log vazio aqui não é ausência de pista: é a pista. Significa que o processo
            # morreu ou travou antes da primeira linha, o que aponta para o boot — conexão
            # com Redis ou carregamento de `content`.
            test -n "$(docker logs draconya-ci 2>&1)" || echo '::error::o container não produziu log nenhum — travou antes de logar'
            exit 1
          fi
          echo

          # Drenar também é contrato: o `game` precisa do SIGTERM para encerrar creditando
          # (ADR 0010). Saída diferente de 0 aqui é drenagem quebrada, não detalhe.
          docker stop draconya-ci
          code=$(docker inspect -f '{{.State.ExitCode}}' draconya-ci)
          docker logs draconya-ci | tail -20
          test "$code" = "0" || { echo "::error::saída $code na drenagem"; exit 1; }
