# O TLS termina no proxy do Coolify. API e socket usam a mesma origem do cliente.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/ {
        # Callback contém código de autenticação: não registrar a query string.
        access_log off;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /ws {
        # Ticket de sessão está na query string e nunca deve entrar no access log.
        access_log off;
        proxy_pass http://app:7171;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # O pacote de assets (FUN-23), montado como volume em /usr/share/nginx/html/things — ver
    # docs/deploy.md. Nada externo: tudo que o Draconya desenha sai desta origem. O hash está
    # no nome de cada arquivo, então uma URL nunca muda de conteúdo e o cache pode ser eterno.
    location /things/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
