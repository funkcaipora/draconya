# Build Pack Docker Compose no Coolify; publique somente o serviço web, porta 80, via HTTPS.
# A origem pública (sem barra final) também deve estar autorizada no WorkOS.
services:
  web:
    build:
      context: .
      target: client
      args:
        VITE_API_URL: ''
        # Derivado de THINGS_VERSION, e não uma variável à parte: é o MESMO número que o
        # `app` compara com o inventário do conteúdo no boot (FUN-21). Duas variáveis
        # seriam duas identidades para um pacote só, e a conferência veria uma delas.
        VITE_THINGS_URL: /things/${THINGS_VERSION:-1332}
    restart: unless-stopped
    expose: ['80']
    # O pacote de arte fica num volume, fora da imagem: `things/<versão>/` do repositório
    # local vai para cá por `scp`/`rsync` uma vez (docs/deploy.md, "O pacote de arte").
    # Sem ele o jogo abre e desenha retângulos — nunca falha por causa de arte.
    volumes: ['things:/usr/share/nginx/html/things:ro']
    depends_on:
      app: { condition: service_healthy }

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    # Migrações terminam antes de aceitar conexões; exec preserva node como PID 1.
    command: ['sh', '-c', 'node packages/server/dist/db/migrate.js && exec node packages/server/dist/main.js']
    environment:
      NODE_ENV: production
      PROCESSES: api,game,jobs
      # O Coolify interpreta este arquivo também no build, sem secrets de runtime.
      # Valor vazio permite construir; PostgreSQL e a validação do servidor recusam o boot.
      DATABASE_URL: postgres://draconya:${POSTGRES_PASSWORD:-}@postgres:5432/draconya
      REDIS_URL: redis://redis:6379
      API_ORIGIN: ${APP_ORIGIN:?configure APP_ORIGIN with an HTTPS origin}
      GAME_PUBLIC_URL: ${GAME_PUBLIC_URL:?configure GAME_PUBLIC_URL with a WSS URL ending in /ws}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:?configure WORKOS_CLIENT_ID}
      WORKOS_REDIRECT_URI: ${APP_ORIGIN}/api/auth/callback
      AUTH_DEV_MODE: 'false'
      # O pacote de arte servido pelo `web` (`/things/<versão>`). O boot recusa subir se o
      # conteúdo foi conferido contra outro (packages/server/src/served-pack.ts).
      THINGS_VERSION: ${THINGS_VERSION:-1332}
      LOG_LEVEL: info
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draconya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: draconya
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
      # Bind (não volume nomeado) na mesma pasta que o próprio Coolify usa para os
      # backups dele (/data/coolify/backups): é ali que as tarefas agendadas do
      # Coolify escrevem, e um bind deixa o dono do servidor copiar com scp/rsync
      # sem passar pelo Docker (docs/deploy.md, "Backup").
      - '/data/coolify/backups/draconya-staging:/backups'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U draconya -d draconya']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - 'redisdata:/data'
      # Mesmo bind do postgres acima, mesma razão.
      - '/data/coolify/backups/draconya-staging:/backups'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  things:
